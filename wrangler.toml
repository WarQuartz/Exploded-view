name = "exploded-view"
main = "worker.js"
compatibility_date = "2026-09-30"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "exploded_view_responses"
